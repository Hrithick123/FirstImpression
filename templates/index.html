<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InstaConnect – Decode Interests, Build Connections</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link
      type="image/png"
      sizes="32x32"
      rel="icon"
      href="assets\icons8-social-32.png"
    />
    <style>
      /* ✅ Global Styling */
      body {
        font-family: "Arial", sans-serif;
        background-color: #f9f9f9; /* Light mode */
        color: #333;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      /* ✅ Chat Container */
      .chat-container {
        width: 90%;
        max-width: 700px;
        background: #ffffff;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      /* ✅ Heading */
      h1 {
        font-size: 28px;
        margin-bottom: 10px;
        color: #0056b3;
      }

      /* ✅ Input & Button */
      .input-container {
        display: flex;
        width: 100%;
        margin-top: 15px;
      }

      input {
        flex: 1;
        padding: 14px;
        font-size: 18px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
        background: #fff;
        color: #333;
      }

      button {
        padding: 14px 20px;
        font-size: 18px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-left: 10px;
        transition: background 0.3s ease;
      }

      button:hover {
        background: #0056b3;
      }

      /* ✅ Chat Output */
      .response-box {
        margin-top: 20px;
        padding: 20px;
        background: #f1f1f1;
        border-radius: 8px;
        text-align: left;
        max-height: 350px;
        overflow-y: auto;
        min-height: 100px;
        font-size: 18px;
      }

      /* ✅ Footer */
      .footer {
        margin-top: 20px;
        font-size: 16px;
        text-align: center;
      }

      .footer a {
        color: #007bff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <h1>InstaConnect</h1>
      <p>Analyze interests & create meaningful connections.</p>

      <div class="input-container">
        <input
          type="text"
          id="user-input"
          placeholder="Enter a public Facebook profile name..."
        />
        <button onclick="sendMessage()">Analyze</button>
      </div>

      <div class="response-box" id="response">
        Enter a name and click Analyze.
      </div>
    </div>

    <div class="footer">
      Developed by <b>Hrithick</b> 💻 for GOVE Enterprises |
      <a href="https://hrithick123.github.io/Hrithickfolio/" target="_blank"
        >My Portfolio</a
      >
    </div>

    <script>
      function sendMessage() {
        let userInput = document.getElementById("user-input").value;
        let responseBox = document.getElementById("response");

        if (!userInput.trim()) {
          responseBox.innerHTML =
            "<p style='color: red;'>⚠️ Please enter a valid profile name.</p>";
          return;
        }

        // ✅ Show "Analyzing..." message
        responseBox.innerHTML = "<p style='color: orange;'>⏳ Analyzing...</p>";

        fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ message: userInput }),
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.response) {
              responseBox.innerHTML = formatResponse(data.response);
            } else {
              responseBox.innerHTML =
                "<p style='color: red;'>⚠️ Error: " + data.error + "</p>";
            }
          })
          .catch(() => {
            responseBox.innerHTML =
              "<p style='color: red;'>⚠️ Something went wrong.</p>";
          });
      }

      function formatResponse(text) {
        text = text.replace(/\n/g, "<br>"); // Preserve line breaks
        text = text.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>"); // Bold text
        text = text.replace(/\*([^\*]+)\*/g, "<i>$1</i>"); // Italicized text
        text = text.replace(/- (.*?)$/gm, "<li>$1</li>"); // Convert bullets to <li>
        return `<div style="text-align: left;"><ul>${text}</ul></div>`; // Wrap in <ul>
      }
    </script>
  </body>
</html>
